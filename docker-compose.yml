services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      SHADOWPATH_DATA_DIR: /app/data
      SHADOWPATH_DATABASE_URL: /app/data/shadowpath.db
      SHADOWPATH_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      SHADOWPATH_DATA_DIR: /app/data
      SHADOWPATH_DATABASE_URL: /app/data/shadowpath.db
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
