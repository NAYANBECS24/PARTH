[project]
name = "shadowpath-nexus"
version = "0.2.0"
description = "Evidence-driven Android APK forensic triage platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "androguard>=4.1.3",
    "openai>=1.50.0",
    "reportlab>=4.2.0",
    "pydantic>=2.7.0",
    "z3-solver>=5.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
